<!--
  EmailJS-template voor de bevestigingsmail.
  Onderwerp (Subject-veld in EmailJS): Reservering bevestigd: {{studio}}
  Gebruikte variabelen: {{naam}}, {{email}}, {{studio}}, {{datum}}, {{starttijd}}, {{eindtijd}}

  Let op: plak alles vanaf de eerste <div> hieronder. De opmaak gebruikt
  bewust <div>'s als buitenkant, omdat de EmailJS-editor een <table> aan het
  begin van de template weghaalt (dan staat lichte tekst op wit).
-->
<div style="background:#0b0b0b; padding:32px 16px;">
  <div style="max-width:480px; margin:0 auto; background:#141414; border-radius:8px; overflow:hidden;">
    <div style="background:#8a19e8; padding:20px 32px;">
      <span style="font-family:Arial, Helvetica, sans-serif; font-weight:900; font-size:20px; letter-spacing:0.02em; color:#f4f1ea;">ARTQUAKE</span>
    </div>
    <div style="padding:32px; background:#141414;">
      <p style="margin:0 0 4px; font-family:Arial, Helvetica, sans-serif; font-weight:700; font-size:11px; letter-spacing:0.14em; color:#f2a81c;">
        GELUKT ✓
      </p>
      <p style="margin:0 0 20px; font-family:Arial, Helvetica, sans-serif; font-weight:900; font-size:24px; line-height:1.2; color:#f4f1ea;">
        Reservering bevestigd.
      </p>
      <p style="margin:0 0 20px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#f4f1ea;">
        Hoi {{naam}}, je reservering staat vast:
      </p>
      <div style="background:#0b0b0b; border-radius:6px; margin-bottom:20px; padding:16px 20px;">
        <p style="margin:0 0 4px; font-family:Arial, Helvetica, sans-serif; font-size:12px; color:#9a9a9a;">Ruimte</p>
        <p style="margin:0 0 14px; font-family:Arial, Helvetica, sans-serif; font-size:15px; font-weight:700; color:#f4f1ea;">{{studio}}</p>
        <p style="margin:0 0 4px; font-family:Arial, Helvetica, sans-serif; font-size:12px; color:#9a9a9a;">Datum</p>
        <p style="margin:0 0 14px; font-family:Arial, Helvetica, sans-serif; font-size:15px; font-weight:700; color:#f4f1ea;">{{datum}}</p>
        <p style="margin:0 0 4px; font-family:Arial, Helvetica, sans-serif; font-size:12px; color:#9a9a9a;">Tijd</p>
        <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:15px; font-weight:700; color:#f4f1ea;">{{starttijd}} tot {{eindtijd}}</p>
      </div>
      <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:13px; line-height:1.6; color:#9a9a9a;">
        Iets veranderd? Neem contact op via <a href="mailto:info@art-quake.com" style="color:#b57bf5;">info@art-quake.com</a> of +31 6 401 29 447.
      </p>
    </div>
    <div style="padding:20px 32px; background:#141414; border-top:1px solid #242424;">
      <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:11px; letter-spacing:0.08em; color:#9a9a9a;">
        ARTQUAKE · Sara de Bronovoland 7, Heerhugowaard
      </p>
    </div>
  </div>
</div>
