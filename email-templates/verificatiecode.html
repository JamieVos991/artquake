<!--
  EmailJS-template voor de verificatiecode.
  Onderwerp (Subject-veld in EmailJS): Je verificatiecode: {{code}}
  Gebruikte variabelen: {{naam}}, {{code}}
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0b0b; padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background:#141414; border-radius:8px; overflow:hidden;">
        <tr>
          <td style="background:#f2a81c; padding:20px 32px;">
            <span style="font-family:Arial, Helvetica, sans-serif; font-weight:900; font-size:20px; letter-spacing:0.02em; color:#0b0b0b;">ARTQUAKE</span>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;">
            <p style="margin:0 0 16px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#f4f1ea;">
              Hoi {{naam}},
            </p>
            <p style="margin:0 0 24px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#f4f1ea;">
              Gebruik onderstaande code om je reservering bij Artquake te bevestigen:
            </p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" style="padding:12px 0 24px;">
                  <span style="display:inline-block; padding:16px 28px; background:#0b0b0b; border:1.5px solid #8a19e8; border-radius:6px; font-family:'Courier New', monospace; font-weight:700; font-size:32px; letter-spacing:0.3em; color:#f4f1ea;">
                    {{code}}
                  </span>
                </td>
              </tr>
            </table>
            <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:13px; line-height:1.6; color:#9a9a9a;">
              Deze code is 15 minuten geldig. Niet zelf om een code gevraagd? Dan kun je deze mail negeren.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px; border-top:1px solid #242424;">
            <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:11px; letter-spacing:0.08em; color:#9a9a9a;">
              ARTQUAKE · Sara de Bronovoland 7, Heerhugowaard · info@art-quake.com
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
